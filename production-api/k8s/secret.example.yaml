# 模板文件：复制为 secret.yaml 并填入真实密钥（secret.yaml 已被 .gitignore 忽略）
# 或者直接用 .env 创建：
#   kubectl create secret generic agent-api-secrets -n production-api --from-env-file=../.env
apiVersion: v1
kind: Secret
metadata:
  name: agent-api-secrets
  namespace: production-api
type: Opaque
stringData:
  OPENAI_API_KEY: sk-your-key-here
  ANTHROPIC_API_KEY: sk-your-key-here
  LANGSMITH_API_KEY: lsv2_your-key-here
  HF_TOKEN: hf_your-key-here
